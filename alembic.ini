# Alembic configuration (used for `alembic revision --autogenerate` during development).
# Runtime upgrades are executed programmatically via backend.database.run_migrations().
[alembic]
script_location = backend/database/migrations
prepend_sys_path = .
sqlalchemy.url = sqlite:///./data/sentinel.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
